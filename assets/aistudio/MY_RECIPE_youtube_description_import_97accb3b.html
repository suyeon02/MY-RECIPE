<style>
:root{--bg:#fafafa;--cd:#fff;--tx:#171717;--sub:#737373;--bd:#e5e5e5;--or:#ff7900;--sf:#fff1e3;--sh:0 4px 18px rgba(0,0,0,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121212;--cd:#1f1f1f;--tx:#f5f5f5;--sub:#a3a3a3;--bd:#333;--sf:#2e2216;--sh:none}}
:root[data-theme=dark]{--bg:#121212;--cd:#1f1f1f;--tx:#f5f5f5;--sub:#a3a3a3;--bd:#333;--sf:#2e2216;--sh:none}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:17px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#app{max-width:480px;height:100%;margin:auto;display:flex;flex-direction:column}
main{flex:1;overflow:auto;padding:4px 18px 110px}h2{font-size:24px;margin:18px 0 8px}h3{font-size:18px;margin:18px 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 6px;border:0}.top .lg{color:var(--or);font-size:22px;font-weight:800}
.top .ic-btn,.circ{width:44px;height:44px;border-radius:50%;background:var(--cd);box-shadow:var(--sh);border:0;font-size:20px;display:flex;align-items:center;justify-content:center;color:var(--tx);padding:0;cursor:pointer}
.bk{background:none;border:0;font:inherit;color:var(--tx);padding:8px 0;cursor:pointer}.s{color:var(--sub);font-size:14px}
input,textarea,select{width:100%;box-sizing:border-box;border:0;border-radius:18px;padding:13px;font:inherit;background:var(--cd);color:var(--tx);box-shadow:var(--sh)}
textarea{min-height:90px;resize:none;overflow-y:auto}
#e4,#e5{height:150px}#e6{min-height:210px;overflow:hidden}#e7{height:130px}#tx{min-height:220px;margin-top:10px}
.bt{display:block;box-sizing:border-box;width:100%;text-align:center;text-decoration:none;background:var(--or);color:#fff;border:0;border-radius:28px;padding:14px;min-height:54px;font:inherit;font-weight:700;cursor:pointer}
.bt.o{background:var(--cd);color:var(--or);box-shadow:var(--sh);border:0}
.cd{background:var(--cd);border:0;border-radius:22px;box-shadow:var(--sh);padding:14px;margin:10px 0}
.ch{display:inline-block;border:0;border-radius:22px;padding:9px 15px;margin:0 6px 8px 0;font:inherit;font-size:15px;background:var(--cd);color:var(--tx);box-shadow:var(--sh);text-decoration:none;cursor:pointer}.ch.on{background:var(--or);color:#fff}
.fl{display:block;font-weight:700;margin:14px 0 6px}.li{display:block;padding:10px 0;border-bottom:1px solid var(--bd)}
.row{display:flex;gap:10px;margin:12px 0;align-items:center}.row .bt{flex:1}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 28px);max-width:452px;border:0;border-radius:28px;background:var(--cd);box-shadow:0 8px 28px rgba(0,0,0,.16);padding:6px 0;z-index:5;display:flex}
nav button{flex:1;border:0;background:none;padding:8px 0;font-size:13px;color:var(--sub);cursor:pointer}nav button.on{color:var(--or);font-weight:700}nav b{display:block;font-size:22px}
.hi{color:var(--sub);margin:8px 0 0;font-size:15px}.hd{font-size:30px;line-height:1.3;font-weight:800;margin:4px 0 16px}.hd em{color:var(--or);font-style:normal}
.sb{position:relative}.sb i{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-style:normal}.sb input{padding-left:46px}
.hs,.cats{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 14px}
.pc{flex:none;width:168px;border-radius:22px;box-shadow:var(--sh);overflow:hidden;background:var(--cd);cursor:pointer}.nm{padding:10px 12px 12px;font-weight:700}
.ph{position:relative;height:128px;display:flex;align-items:center;justify-content:center;font-size:58px;background:var(--sf);overflow:hidden}
.pill{position:absolute;left:10px;top:10px;background:var(--cd);border-radius:14px;padding:2px 10px;font-size:13px;font-weight:700}
.hr{position:absolute;right:10px;top:8px;width:34px;height:34px;border-radius:50%;background:var(--cd);display:flex;align-items:center;justify-content:center;color:var(--or);font-size:18px;cursor:pointer}
.lc{display:flex;align-items:center;gap:12px;border-radius:22px;background:var(--cd);box-shadow:var(--sh);padding:10px;margin:10px 0;cursor:pointer}
.lc .ph{width:72px;height:72px;font-size:36px;border-radius:18px;flex:none}.lc .nm{padding:0}.lc .hr{position:static;margin-left:auto;background:none;flex:none}
.ct{flex:none;width:68px;text-align:center;font-size:13px;color:var(--sub);background:none;border:0;padding:0;cursor:pointer}.ct span{display:flex;width:68px;height:68px;border-radius:22px;background:var(--cd);box-shadow:var(--sh);align-items:center;justify-content:center;font-size:30px;margin-bottom:6px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;overflow:visible;padding:4px 0 8px}.cats .ct{width:auto}.cats .ct span{width:72px;height:72px;margin:0 auto 6px}
.hero{position:relative;height:240px;border-radius:30px;background:var(--sf);display:flex;align-items:center;justify-content:center;font-size:110px;overflow:hidden}
.play{position:absolute;right:14px;bottom:14px;width:54px;height:54px;border-radius:50%;background:var(--or);color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none}
.ing{display:flex;align-items:center;gap:12px;border-radius:18px;box-shadow:var(--sh);padding:12px 16px;margin:10px 0;background:var(--cd)}
.ing span{font-size:18px;font-weight:normal;color:var(--tx)}.ing b{font-size:18px;font-weight:normal;color:var(--tx);margin-left:auto}
.stp{display:flex;gap:12px;align-items:flex-start;background:var(--cd);border-radius:20px;box-shadow:var(--sh);padding:16px;margin:12px 0;font-size:19px;line-height:1.6}
.stp .n{width:38px;height:38px;line-height:38px;font-size:18px;margin:0;flex:none;border-radius:50%;background:var(--or);color:#fff;text-align:center}
.stp .tm{display:inline-block;background:var(--sf);border-radius:12px;padding:0 10px;font-size:15px;margin:0 6px 4px 0;color:var(--or);font-weight:700;text-decoration:none}.tt{color:var(--or)}
.sec{display:flex;justify-content:space-between;align-items:center}
.stepper{display:flex;align-items:center;gap:8px;background:var(--cd);box-shadow:var(--sh);border-radius:26px;padding:4px}
.stepper button{width:38px;height:38px;border-radius:50%;border:0;background:var(--or);color:#fff;font-size:22px;font-weight:700;padding:0;cursor:pointer}.stepper b{min-width:58px;text-align:center}
.acts{position:absolute;right:12px;top:12px;display:flex;gap:8px;z-index:2}
.ic{min-width:36px;height:36px;border-radius:18px;border:0;background:rgba(255,255,255,.92);box-shadow:var(--sh);font-size:16px;padding:0;display:flex;align-items:center;justify-content:center;color:#171717;cursor:pointer}
.ic.rd{background:#e5484d;color:#fff;font-size:14px;font-weight:700;padding:0 12px}
.pi{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.ci{display:flex;align-items:center;gap:14px;padding:12px 4px;font-size:18px;border-bottom:1px solid var(--bd)}.ci:last-child{border:0}
.ci input{width:24px;height:24px;flex:none;padding:0;margin:0;box-shadow:none;accent-color:var(--or)}.ci:has(input:checked){color:var(--sub);text-decoration:line-through}
.mc{display:flex;align-items:center;gap:18px;min-height:112px;padding:20px;margin:16px 0;cursor:pointer}.mc b{font-size:21px}.mc .mi{font-size:46px;flex:none}.mc .s{font-size:15px;margin-top:4px}
.bb{padding:12px 14px;border-radius:14px;margin:8px 0;max-width:88%;white-space:pre-wrap}.bb.user{background:var(--or);color:#fff;margin-left:auto}.bb.assistant{background:var(--sf)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#171717;color:#fff;padding:12px 18px;border-radius:24px;font-size:15px;z-index:999}

/* Export Modal */
.mdl-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:99;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.mdl{background:var(--cd);width:100%;max-width:440px;border-radius:24px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.2);max-height:85vh;display:flex;flex-direction:column;box-sizing:border-box}
.mdl-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.mdl-h b{font-size:20px}
.mdl-close{background:none;border:0;font-size:22px;cursor:pointer;color:var(--tx);padding:0 4px}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ==========================================================================
   1. Firebase Configuration (본인의 파이어베이스 정보로 수정하세요)
   ========================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyA6dmsBjFwR1e9lYXzGuPlEAmlx6PsdjjM",
  authDomain: "my-recipe-3008f.firebaseapp.com",
  projectId: "my-recipe-3008f",
  storageBucket: "my-recipe-3008f.firebasestorage.app",
  messagingSenderId: "375766443670",
  appId: "1:375766443670:web:3c0438d32f264bd57384b7",
  measurementId: "G-X08TQKJBPX"
};

let db = null;
try {
  if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }
} catch(e) {
  console.warn("Firebase initialized in offline/fallback mode:", e);
}

/* ==========================================================================
   2. Base State & Constants
   ========================================================================== */
const $ = s => document.querySelector(s);
const E = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const L = s => String(s || '').split('\n').map(x => x.trim()).filter(Boolean);

const CATS = ['밑반찬', '국·찌개', '메인 요리', '면·분식', '밥·죽', '간식·디저트', '기타'];
const FIL = ['최근 저장순'];
const SRC = { 'SNS': 'sns', '직접 작성': 'my', '사진': 'photo' };
const SL = { sns: 'SNS', my: '직접 작성', photo: '사진', ai: 'AI' };
const TS = /^(\d+):(\d\d)\s*/;
const NEW = { id: 0, name: '', cat: '기타', min: '', ing: '', sau: '', steps: '', tip: '', url: '', src: 'my' };
const FMT = `아래 레시피 링크 내용을 분석해서 아래 키 형식의 JSON으로만 출력해줘 (다른 설명 금지):\n{\n  "name": "요리 이름",\n  "cat": "${CATS.join('/')} 중 하나",\n  "min": 조리시간숫자(분 단위),\n  "serv": 몇인분인지숫자(모르면 2),\n  "ing": "필수 재료와 분량 (줄바꿈 구분)",\n  "sau": "양념과 분량 (줄바꿈 구분)",\n  "steps": "조리 순서 (한 줄에 한 단계, 시간 알면 앞에 01:23 형식)",\n  "tip": "요리 팁"\n}\n\n`;

const SEED = [
  { id: 1, name: '제육볶음', cat: '메인 요리', src: 'sns', url: '', min: 25, serv: 2, ing: '돼지고기 앞다리살 600g\n양파 1개\n대파 1대', sau: '고추장 2큰술\n간장 2큰술\n설탕 1큰술\n다진 마늘 1큰술', steps: '양파와 대파를 썬다\n고추장·간장·설탕·마늘을 섞어 양념장을 만든다\n고기를 양념에 10분 재운다\n센 불에서 고기를 8분 볶는다\n양파와 대파를 넣고 3분 더 볶는다', tip: '센 불에서 빨리 볶아야 고기가 질기지 않아요.', t: 2, fav: 1 },
  { id: 2, name: '계란말이', cat: '밑반찬', src: 'my', url: '', min: 10, serv: 2, ing: '계란 4개\n당근 1/4개\n대파 1/2대', sau: '소금 1꼬집\n맛술 1큰술', steps: '계란을 풀고 다진 채소와 양념을 섞는다\n약불에서 얇게 부어 5분간 돌돌 만다\n식힌 뒤 썬다', tip: '', t: 1 }
];

let R = SEED;
let tab = 'home', imp = '', v = null, ed = null, ck = null, cat = '', fl = '', q = '', cur = '', dl = 0, chat = [], pf = null, pv = '';
let sg = 2, sgId = 0, dr = { d: '', t: '' };
let expOpen = false, expSel = {};

/* ==========================================================================
   3. Helpers & Modals
   ========================================================================== */
const toast = t => {
  const d = document.createElement('div');
  d.className = 'toast';
  d.textContent = t;
  document.body.append(d);
  setTimeout(() => d.remove(), 2200);
};

const pj = t => JSON.parse(t.match(/\{[\s\S]*\}/)[0]);
const mm = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
const det = () => R.find(r => r.id == v);
const sc = (s, f) => f == 1 ? s : s.replace(/([0-9]+(?:[.][0-9]+)?)(?:[/]([0-9]+))?/g, (m, a, b) => {
  let n = (+a / (b ? +b : 1)) * f;
  return n >= 10 ? Math.round(n) : +n.toFixed(n >= 1 ? 1 : 2);
});
const stx = s => E(s.replace(TS, '')).replace(/([0-9]+ ?분)/g, '<b class=tt>$1</b>');
const yt = u => {
  const m = (u || '').match(/(youtu.be[/]|v=|shorts[/])([0-9A-Za-z_-]{11})/);
  return m ? m[2] : '';
};
const EMJ = ['🥗', '🍲', '🍖', '🍜', '🍚', '🍰', '🍽️'];
const em = r => EMJ[CATS.indexOf(r.cat)] || '🍽️';
const pic = r => r.img ? `<img class=pi src="${r.img}">` : (yt(r.url) ? `<img class=pi src="https://i.ytimg.com/vi/${yt(r.url)}/hqdefault.jpg" onerror="this.replaceWith('${em(r)}')">` : em(r));

// Export Popup Modal
const toggleExp = () => { expOpen = !expOpen; go(); };
const toggleAllExp = () => {
  const allSelected = R.every(r => expSel[r.id]);
  R.forEach(r => expSel[r.id] = !allSelected);
  go();
};
const expModal = () => !expOpen ? '' : `
<div class="mdl-bg" onclick="if(event.target===this)toggleExp()">
  <div class="mdl">
    <div class="mdl-h"><b>📥 레시피 내보내기</b><button class="mdl-close" onclick="toggleExp()">✕</button></div>
    <p class="s" style="margin:0 0 10px">저장할 레시피를 선택해 원하는 메모장에 공유하거나 복사하세요.</p>
    <div class="row" style="margin:0 0 10px">
      <button class="bt o" style="padding:8px;font-size:14px;flex:1" onclick="toggleAllExp()">${R.length > 0 && R.every(r => expSel[r.id]) ? '☑️ 전체 해제' : '☑️ 전체 선택 / 해제'}</button>
    </div>
    <div style="max-height:260px;overflow-y:auto;margin-bottom:14px">
      ${R.map(r => `<label class="ci" style="font-size:16px"><input type="checkbox" ${expSel[r.id] ? 'checked' : ''} onchange="expSel[${r.id}]=this.checked"><span>${E(r.name)} (${r.cat})</span></label>`).join('')}
    </div>
    <div class="row" style="margin:0">
      <button class="bt o" style="flex:1;padding:12px;font-size:15px;min-height:48px" onclick="copyRecipes()">📋 복사하기</button>
      <button class="bt" style="flex:1;padding:12px;font-size:15px;min-height:48px" onclick="shareToMemo()">📱 메모장으로 저장</button>
    </div>
  </div>
</div>`;

const getSelectedRecipesText = () => {
  const selected = R.filter(r => expSel[r.id]);
  if (selected.length === 0) {
    toast('선택된 레시피가 없어요');
    return null;
  }
  return selected.map(r => 
`====================
요리명: ${r.name}
카테고리: ${r.cat}
조리시간: ${r.min || '-'}분
기준인분: ${r.serv || 2}인분
원문링크: ${r.url || '-'}

[재료]
${r.ing}

[양념]
${r.sau || '-'}

[조리순서]
${r.steps}

[나만의 팁]
${r.tip || '-'}
====================
`
  ).join('\n\n');
};

const shareToMemo = async () => {
  const text = getSelectedRecipesText();
  if (!text) return;
  
  if (navigator.share) {
    try {
      await navigator.share({
        title: '내 레시피 모음',
        text: text
      });
      toggleExp();
    } catch(e) {
      if (e.name !== 'AbortError') {
        copyRecipes();
      }
    }
  } else {
    copyRecipes();
  }
};

const copyRecipes = () => {
  const text = getSelectedRecipesText();
  if (!text) return;
  
  const textarea = document.createElement('textarea');
  textarea.value = text;
  document.body.appendChild(textarea);
  textarea.select();
  try {
    document.execCommand('copy');
    toast('클립보드에 복사되었어요! 메모장에 붙여넣으세요.');
    toggleExp();
  } catch(err) {
    toast('복사에 실패했습니다.');
  }
  document.body.removeChild(textarea);
};

/* ==========================================================================
   4. UI Components & Render Functions
   ========================================================================== */
const heart = r => `<span class=hr onclick="event.stopPropagation();fav(${r.id})">${r.fav ? '♥' : '♡'}</span>`;
const pc = r => `<div class=pc onclick="v=${r.id};go()"><div class=ph>${pic(r)}${r.min ? `<span class=pill>${r.min}분</span>` : ''}${heart(r)}</div><div class=nm>${E(r.name)}</div></div>`;
var card = r => `<div class=lc onclick="v=${r.id};go()"><div class=ph>${pic(r)}</div><div class=nm>${E(r.name)}<div class=s>${r.cat}${r.min ? ' · ' + r.min + '분' : ''} · ${SL[r.src] || ''}</div></div>${heart(r)}</div>`;
var lst = a => a.map(card).join('') || '<p class=s>레시피가 없어요</p>';

const flt = () => {
  let a = R.filter(r => (!cat || r.cat == cat) && (!q || (r.name + r.ing + r.sau).includes(q)));
  if (SRC[fl]) a = a.filter(r => r.src == SRC[fl]);
  if (fl == '즐겨찾기') a = a.filter(r => r.fav);
  if (fl == '최근 요리한 순') return a.filter(r => r.cooked).sort((x, y) => y.cooked - x.cooked);
  return a.sort((x, y) => y.t - x.t);
};

var hl = () => q ? lst(flt()) : `
<h3>카테고리</h3>
<div class=cats>${['', ...CATS].map((c, i) => `<button class=ct onclick="tab='my';cat='${c}';go()"><span>${i ? EMJ[i - 1] : '📖'}</span>${c || '전체'}</button>`).join('')}</div>
<h3>최근 저장 레시피</h3>
<div class=hs>${R.slice().sort((a, b) => b.t - a.t).slice(0, 6).map(pc).join('') || '<p class=s>레시피가 없어요</p>'}</div>
<h3>즐겨찾기</h3>
${R.some(r => r.fav) ? `<div class=hs>${R.filter(r => r.fav).map(pc).join('')}</div>` : '<p class=s>♡를 눌러 즐겨찾기에 추가해요</p>'}`;

var homeV = () => `
<p class=hi>좋은 하루예요 👋</p>
<div class=hd>오늘은 어떤 <em>요리</em>를<br>해볼까요? 🍳</div>
<div class=sb><i>🔍</i><input placeholder="요리명 또는 재료 검색" value="${E(q)}" oninput="q=this.value;$('#hl').innerHTML=hl()"></div>
<button class=bt style="margin:14px 0" onclick="tab='imp';imp='sns';go()">🔗 SNS 레시피 가져오기</button>
<div id=hl>${hl()}</div>`;

function pick(k) { pf = null; pv = ''; dr = { d: '', t: '' }; imp = k; go(); }
function pickF(el) {
  const f = el.files[0];
  if (!f) return;
  pf = f;
  if (imp == 'my') dr = { d: $('#d').value, t: $('#tx').value };
  const r = new FileReader();
  r.onload = () => {
    const i = new Image();
    i.onload = () => {
      const c = document.createElement('canvas'), k = Math.min(1, 800 / i.width);
      c.width = i.width * k; c.height = i.height * k;
      c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
      pv = c.toDataURL('image/jpeg', .7);
      go();
    };
    i.onerror = () => { pv = ''; go(); };
    i.src = r.result;
  };
  r.readAsDataURL(f);
}

async function fav(id) {
  const r = R.find(x => x.id == id);
  if (!r) return;
  r.fav = r.fav ? 0 : 1;
  if (db) {
    try { await db.collection('recipes').doc(String(id)).update({ fav: r.fav }); } catch(e){}
  }
  go();
}

async function del(id) {
  if (dl != id) { dl = id; return go(); }
  if (db) {
    try { await db.collection('recipes').doc(String(id)).delete(); } catch(e){}
  }
  R = R.filter(x => x.id != id);
  dl = 0; v = null; go();
}

async function saveR() {
  const r = {
    ...ed,
    name: $('#e1').value.trim(),
    cat: $('#e2').value,
    min: $('#e3').value,
    ing: $('#e4').value,
    sau: $('#e5').value,

    tip: $('#e7').value,
    url: $('#e8').value.trim(),
    serv: +$('#e9').value || 2
  };

    R.unshift(r);
  } else {
    R = R.map(x => x.id == r.id ? r : x);
  }

  if (db) {
    try {
      await db.collection('recipes').doc(String(r.id)).set(r);

    } catch(e) {

  }

  ed = null; imp = ''; tab = 'my'; v = r.id; go();
}

function setT() {
  clearInterval(ck.iv); ck.iv = 0;
  const m = (L(ck.r.steps)[ck.i] || '').match(/(\d+)\s*분/);
  ck.t = m ? m[1] * 60 : 0;
}

function cook(id) {
  ck = { r: R.find(x => x.id == id), i: 0, chk: {}, open: 1, iv: 0, t: 0 };
  setT(); go();
}

function tick() {
  if (ck.iv) { clearInterval(ck.iv); ck.iv = 0; }
  else {
    ck.iv = setInterval(() => {
      ck.t--;
      if (ck.t <= 0) {
        clearInterval(ck.iv); ck.iv = 0;
        if (navigator.vibrate) navigator.vibrate(600);
        toast('⏰ 시간이 다 됐어요'); go();
      } else {
        const tmEl = $('#tm');
        if (tmEl) tmEl.textContent = mm(ck.t);
      }
    }, 1000);
  }
  go();
}

async function step(d) {
  ck.i = Math.max(0, ck.i + d);
  if (ck.i >= L(ck.r.steps).length) {
    ck.r.cooked = Date.now();
    if (db) {
      try { await db.collection('recipes').doc(String(ck.r.id)).update({ cooked: ck.r.cooked }); } catch(e){}
    }
    toast('요리 완료! 수고하셨어요');
    return quit();
  }
  setT(); go();
}

function quit() {
  if (ck) clearInterval(ck.iv);
  ck = null; go();
}

async function fetchYoutubeDetails(url) {
  const videoId = yt(url);
  if (!videoId) throw new Error('Unsupported YouTube URL');
  const endpoint = new URL('https://www.googleapis.com/youtube/v3/videos');
  endpoint.searchParams.set('part', 'snippet');
  endpoint.searchParams.set('id', videoId);
  endpoint.searchParams.set('key', firebaseConfig.apiKey);
  const response = await fetch(endpoint);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error?.message || 'YouTube description request failed');
  const snippet = data.items?.[0]?.snippet;
  if (!snippet) throw new Error('No public video description');
  return { videoId, title: snippet.title || '', channel: snippet.channelTitle || '', description: snippet.description || '' };
}

      const d = $('#d').value.trim(), t = $('#tx').value.trim();
      if (!t) return m.textContent = '레시피 내용을 적어 주세요';
      p = FMT + (d ? '요리 이름: ' + d + '\n' : '') + '아래는 사용자가 자유롭게 쓴 레시피야. 내용을 지어내거나 바꾸지 말고 그대로 재료·양념·순서·팁으로 나눠 정리해.\n\n' + t;
    } else if (k == 'ai') {
      const d = $('#d').value.trim();
      if (!d) return m.textContent = '요리 이름을 입력해 주세요';
      p = FMT + '요리 이름: ' + d + '\n일반적인 레시피 초안을 만들어줘.';
    } else {
      const f = pf;
      if (!f) return m.textContent = '사진을 선택해 주세요';
      p = FMT + '첨부한 사진 속 글자를 읽어 정리해 줘.';
      o = { images: [f] };
    }
    
    const s = await window.claude?.use('sample');
    if (!s) throw 0;
    if (k == 'photo' && !(await s.limits()).images) return m.textContent = '이 화면에서는 사진 읽기를 쓸 수 없어요';
    
    const j = pj((await s(p, o)).text);
    if (k == 'sns' && (j.error == 'LINK_UNAVAILABLE' || j.error == 'INSUFFICIENT_RECIPE_CONTENT' || !L(j.ing).length || !L(j.steps).length)) {
      openSnsManual(u);
      return;
    }
    ['ing', 'sau', 'steps'].forEach(x => Array.isArray(j[x]) && (j[x] = j[x].join('\n')));
    if (!CATS.includes(j.cat)) j.cat = '기타';
    j.serv = parseInt(j.serv) || 2;
    if (k == 'my') {
      const d = $('#d')?.value.trim();
      if (d) j.name = d;
    }
    
    let thumbImg = '';
    if (k == 'sns') {
      const ytId = yt(u);
      if (ytId) {
        thumbImg = `https://i.ytimg.com/vi/${ytId}/hqdefault.jpg`;
      }
    } else if (k == 'photo' || k == 'my') {
      thumbImg = pv;
    }

    ed = { ...NEW, ...j, id: 0, src: k, url: u, img: thumbImg };
    if (k == 'sns') {
      ed.name = ed.name || '유튜브 레시피';
      ed.id = ed.t = Date.now();
      R.unshift(ed);
      if (db) { try { await db.collection('recipes').doc(String(ed.id)).set(ed); } catch(e){} }
      v = ed.id; ed = null; imp = ''; tab = 'my'; toast('영상을 분석해 레시피로 저장했어요!');
      return go();
    } else if (k == 'my') {
      ed.name = ed.name || '이름 없는 레시피';
      ed.id = ed.t = Date.now();
      R.unshift(ed);
      if (db) { try { await db.collection('recipes').doc(String(ed.id)).set(ed); } catch(e){} }
      v = ed.id; ed = null; imp = ''; tab = 'my'; toast('저장했어요');
      return go();
    }
    go();
  } catch (e) {
    if (k == 'sns') { openSnsManual(u, '\uC720\uD29C\uBE0C \uC124\uBA85\uC744 \uAC00\uC838\uC624\uC9C0 \uBABB\uD588\uC5B4\uC694. YouTube Data API v3 \uC0AC\uC6A9 \uC124\uC815\uACFC API \uD0A4 \uC81C\uD55C\uC744 \uD655\uC778\uD558\uAC70\uB098 \uC218\uAE30\uB85C \uC791\uC131\uD574 \uC800\uC7A5\uD558\uC138\uC694'); return; }
    m.textContent = '\uC694\uB9AC \uC815\uB9AC\uC5D0 \uC2E4\uD328\uD588\uC5B4\uC694. \uC7A0\uC2DC \uD6C4 \uB2E4\uC2DC \uC2DC\uB3C4\uD574 \uC8FC\uC138\uC694.';
  }
}

async function send(t) {
  t = (t || '').trim();
  if (!t) return;
  chat.push({ role: 'user', content: t });
  const a = { role: 'assistant', content: '생각 중…' };
  chat.push(a);
  go();
  try {
    const s = await window.claude?.use('sample');
    if (!s) throw 0;
    const c = R.find(x => x.id == cur);
    const h = chat.slice(0, -1).map(m => ({ ...m }));
    h[h.length - 1].content = `너는 친절한 요리 도우미야. 40대 이상 사용자가 이해하기 쉬운 한국어로 짧게 답해.${c ? ' 현재 레시피: ' + JSON.stringify({ name: c.name, 재료: c.ing, 양념: c.sau, 순서: c.steps }) : ''}\n질문: ` + t;
    a.content = (await s(h, { cache: false })).text;
  } catch(e) {
    a.content = '지금은 AI 답변을 받을 수 없어요. 잠시 후 다시 시도해 주세요.';
  }
  go();
}

function shr(f, cb, w = 800) {
  const r = new FileReader();
  r.onload = () => {
    const i = new Image();
    i.onload = () => {
      const c = document.createElement('canvas'), k = Math.min(1, w / i.width);
      c.width = i.width * k; c.height = i.height * k;
      c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', .75));
    };
    i.onerror = () => cb('');
    i.src = r.result;
  };
  r.readAsDataURL(f);
}

function syn() {
  ed = {
    ...ed,
    name: $('#e1').value,
    cat: $('#e2').value,
    min: $('#e3').value,
    serv: +$('#e9').value || 2,
    ing: $('#e4').value,
    sau: $('#e5').value,
    steps: $('#e6').value,
    tip: $('#e7').value,
    url: $('#e8').value
  };
}

function cover(el) {
  const f = el.files[0];
  if (!f) return;
  syn();
  shr(f, d => { if (d) ed.img = d; go(); });
}

var ytOK = false;
var vid = r => yt(r.url) ? `<iframe id=yp src="https://www.youtube.com/embed/${yt(r.url)}?enablejsapi=1&playsinline=1&rel=0" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen onload="this.contentWindow.postMessage(JSON.stringify({event:'listening'}),'*');setTimeout(()=>{const f=$('#yf');f&&!ytOK&&(f.style.display='flex')},6000)" style="position:absolute;left:0;top:0;width:100%;height:100%;border:0"></iframe><a id=yf href="${E(r.url)}" target=_blank rel=noopener style="display:none;position:absolute;left:0;top:0;width:100%;height:100%;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--sf);color:var(--or);font-size:20px;font-weight:700;text-decoration:none;text-align:center">▶ 영상 열기<span style="font-size:13px;font-weight:400;color:var(--sub)">이 화면에서는 앱 안 재생이 막혀 있어요</span></a>` : '';

addEventListener('message', e => {
  if (/youtube/.test(e.origin)) {
    ytOK = true;
    const f = $('#yf');
    if (f) f.style.display = 'none';
  }
});

function yc(f, a) { $('#yp').contentWindow.postMessage(JSON.stringify({ event: 'command', func: f, args: a || [] }), '*'); }
function seek(s) {
  const u = det().url;
  if (ytOK && $('#yp')) {
    yc('seekTo', [s, true]); yc('playVideo');
    $('main').scrollTo({ top: 0, behavior: 'smooth' });
  } else window.open(u + (u.includes('?') ? '&' : '?') + 't=' + s, '_blank');
}

function srv(d) {
  const r = det();
  sg = Math.min(20, Math.max(1, sg + d));
  const f = sg / (+r.serv || 2);
  document.querySelectorAll('[data-a]').forEach(b => b.textContent = sc(b.dataset.a, f));
  $('#sgn').textContent = sg + '인분';
  $('#sgf').textContent = '기준 ' + (+r.serv || 2) + '인분' + (f != 1 ? ' → 분량 ×' + (+f.toFixed(2)) : '');
}

function ar(t) {
  t.style.height = 'auto';
  t.style.height = Math.max(210, t.scrollHeight + 4) + 'px';
}

/* App Initialization & Data Fetching */
async function initApp() {
  if (db) {
    try {
      const snapshot = await db.collection('recipes').orderBy('t', 'desc').get();
      if (!snapshot.empty) {
        R = snapshot.docs.map(doc => doc.data());
      } else {
        for (let r of SEED) {
          await db.collection('recipes').doc(String(r.id)).set(r);
        }
      }
    } catch(e) {
      console.warn("Using offline seed data:", e);
    }
  }
  go();
}

window.onload = function() {
  initApp();
};
</script>
